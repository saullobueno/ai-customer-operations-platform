name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-latest
    env:
      # Valores fictícios: suficientes para o build avaliar a config de auth/DB
      # sem se conectar a nada de verdade. Testes de integração usam PGlite
      # (ver docs/decisions/0003-pglite-for-tests.md), não estes serviços.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ai_customer_operations"
      REDIS_URL: "redis://localhost:6379"
      BETTER_AUTH_SECRET: "ci-only-secret-not-for-production"
      BETTER_AUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm run test:coverage

      - run: npm run build
